server {
    listen 80;
    server_name _;

    # Real files must exist - a missing asset gives a 404, not index.html
    location ~* \.(?:js|mjs|css|json|map|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}