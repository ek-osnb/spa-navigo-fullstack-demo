services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:9000:80"
    environment:
      - DOMAIN=http://localhost
      - BACKEND_UPSTREAM=host.docker.internal:8080
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: app
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "127.0.0.1:3306:3306"
